services:
  - type: web
    name: hadex-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: UAH_CARD
        sync: false
      - key: TRON_WALLET
        sync: false
      - key: TRONGRID_API_KEY
        sync: false
